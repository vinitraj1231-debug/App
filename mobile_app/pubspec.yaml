name: mobile_app
description: "A feature-rich Telegram Clone Flutter application with full offline access and real-time messaging."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.0
  socket_io_client: ^2.0.3+1
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
